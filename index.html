<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>Oficina</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#155eef;--n:#101828;--m:#667085;--l:#d0d5dd;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--n)}header{position:sticky;top:0;z-index:5;background:#0f172a;color:#fff;padding:15px 16px;display:flex;justify-content:space-between;align-items:center}header b{font-size:22px}.wrap{max-width:760px;margin:auto;padding:14px 14px 95px}.view{display:none}.view.on{display:block}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:16px;margin:12px 0}.hero{background:#101828;color:#fff;border-radius:20px;padding:20px}.hero h2{font-size:30px;margin:0 0 8px}.hero p{margin:0;color:#d0d5dd}.btn{width:100%;min-height:58px;border:0;border-radius:14px;padding:12px;font-size:18px;font-weight:800;cursor:pointer}.p{background:var(--b);color:#fff}.s{background:#eef4ff;color:#1849a9}.d{background:#fee4e2;color:#912018}.btn+.btn{margin-top:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#fff;border:1px solid #d0d5dd;border-radius:17px;min-height:105px;padding:15px;text-align:left;font-weight:800;font-size:17px}.tile span{display:block;font-size:27px;margin-bottom:7px}label{display:block;font-weight:800;margin:13px 0 6px}input,select,textarea{width:100%;min-height:54px;border:2px solid var(--l);border-radius:12px;padding:11px;font-size:18px;background:#fff}textarea{min-height:90px}.muted{color:var(--m)}.row{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:13px;margin:9px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.row small{display:block;color:var(--m);margin-top:4px}.mini{border:0;border-radius:9px;min-height:42px;padding:8px 11px;font-weight:800}.photo{display:flex;gap:12px;align-items:center;border:2px dashed #84adff;background:#f5f8ff;border-radius:14px;padding:15px;min-height:85px;margin-top:14px}.photo input{display:none}.photo span:first-of-type{font-size:30px}.msg{padding:11px;border-radius:10px;margin-top:10px}.ok{background:#dcfae6;color:#05603a}.err{background:#fee4e2;color:#912018}.hide{display:none!important}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head .btn{width:auto;min-height:45px;font-size:15px}.back{border:0;background:transparent;font-weight:800;font-size:16px;padding:8px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:8}.nav button{border:0;background:none;min-height:52px;font-size:12px;font-weight:800}.nav span{display:block;font-size:21px}.part{border:1px solid #e4e7ec;border-radius:12px;padding:11px;margin-top:9px}.count{font-size:31px;font-weight:900}.login{max-width:440px;margin:35px auto}</style></head><body><header><div><b>🔧 Oficina</b><div id="who" style="font-size:12px;color:#cbd5e1">Gestão simples</div></div><button id="out" class="hide" style="border:0;border-radius:9px;padding:9px 12px;font-weight:800">Sair</button></header><main class="wrap"><section id="auth" class="view on"><div class="login"><h2>Entrar na oficina</h2><p class="muted">Uma conta por oficina neste MVP.</p><div class="card"><label>Email</label><input id="em" type="email" placeholder="nome@oficina.pt"><label>Palavra-passe</label><input id="pw" type="password" placeholder="Mínimo 6 caracteres"><button id="login" class="btn p" style="margin-top:15px">Entrar</button><button id="signup" class="btn s">Criar conta</button><div id="amsg"></div></div></div></section><section id="home" class="view"><div class="hero"><h2>Registar sem complicações.</h2><p>Matrícula → km → trabalho → peças → fotos → guardar.</p></div><div class="card"><button class="btn p" onclick="go('interv')">＋ Nova intervenção</button></div><div class="grid"><button class="tile" onclick="go('vehicles')"><span>🚗</span>Viaturas</button><button class="tile" onclick="go('clients')"><span>👤</span>Clientes</button><button class="tile" onclick="go('history')"><span>🧾</span>Histórico</button><button class="tile" onclick="dash()"><span>↻</span>Atualizar</button></div><div class="card"><div class="grid"><div><div id="cc" class="count">0</div><span class="muted">Clientes</span></div><div><div id="vc" class="count">0</div><span class="muted">Viaturas</span></div></div></div></section><section id="clients" class="view"><button class="back" onclick="go('home')">← Voltar</button><div class="head"><h2>Clientes</h2><button class="btn p" onclick="clientForm()">＋ Novo</button></div><input id="cs" placeholder="Pesquisar nome ou telefone" oninput="renderClients()"><div id="cf" class="card hide"><input id="cid" type="hidden"><label>Nome</label><input id="cn"><label>Telemóvel</label><input id="cp" type="tel"><label>Email</label><input id="ce" type="email"><label>NIF</label><input id="ct"><label>Notas</label><textarea id="cno"></textarea><button class="btn p" onclick="saveClient()">✓ Guardar cliente</button><button class="btn s" onclick="$('cf').classList.add('hide')">Cancelar</button></div><div id="cl"></div></section><section id="vehicles" class="view"><button class="back" onclick="go('home')">← Voltar</button><div class="head"><h2>Viaturas</h2><button class="btn p" onclick="vehicleForm()">＋ Nova</button></div><input id="vs" placeholder="Pesquisar matrícula, marca ou modelo" oninput="renderVehicles()"><div id="vf" class="card hide"><input id="vid" type="hidden"><label>Matrícula</label><input id="vp" placeholder="00-AA-00"><label>Cliente</label><select id="vclient"></select><div class="grid"><div><label>Marca</label><input id="vb"></div><div><label>Modelo</label><input id="vm"></div></div><div class="grid"><div><label>Ano</label><input id="vy" type="number"></div><div><label>Quilómetros</label><input id="vkm" type="number"></div></div><label>VIN / Chassis</label><input id="vv"><label>Notas</label><textarea id="vn"></textarea><button class="btn p" onclick="saveVehicle()">✓ Guardar viatura</button><button class="btn s" onclick="$('vf').classList.add('hide')">Cancelar</button></div><div id="vl"></div></section><section id="interv" class="view"><button class="back" onclick="go('home')">← Voltar</button><h2>Nova intervenção</h2><div class="card"><h3>1. Viatura</h3><label>Matrícula</label><input id="ip" placeholder="00-AA-00"><button class="btn s" onclick="findVehicle()">Pesquisar matrícula</button><div id="match"></div></div><div class="card"><h3>2. Entrada</h3><label>Data</label><input id="idate" type="date"><label>Quilómetros</label><input id="ikm" type="number"><label class="photo"><input id="odo" type="file" accept="image/*" capture="environment"><span>📷</span><span><b>Fotografia do conta-quilómetros</b><small class="muted"> Tocar para tirar fotografia</small></span></label><div id="odon" class="muted"></div></div><div class="card"><h3>3. Trabalho realizado</h3><label>Tipo de serviço</label><input id="itype" placeholder="Ex.: Revisão, travões, diagnóstico"><label>Descrição</label><textarea id="idesc"></textarea><div class="head"><h3>Peças</h3><button class="btn s" onclick="addPart()">＋ Peça</button></div><div id="parts"></div><label class="photo"><input id="photos" type="file" accept="image/*" capture="environment" multiple><span>📷</span><span><b>Fotografias do trabalho</b><small class="muted"> Peças, danos ou montagem</small></span></label><div id="phn" class="muted"></div><label>Observações</label><textarea id="inotes"></textarea><button id="savei" class="btn p" onclick="saveIntervention()">✓ Terminar e guardar</button><div id="imsg"></div></div></section><section id="history" class="view"><button class="back" onclick="go('home')">← Voltar</button><h2>Histórico</h2><input id="hs" placeholder="Pesquisar matrícula ou serviço" oninput="renderHistory()"><div id="hl"></div></section></main><nav id="nav" class="nav hide"><button onclick="go('home')"><span>⌂</span>Início</button><button onclick="go('interv')"><span>＋</span>Intervenção</button><button onclick="go('vehicles')"><span>🚗</span>Viaturas</button><button onclick="go('clients')"><span>👤</span>Clientes</button></nav><script>const U='https://dysqdeqqikyjrmqmtpsl.supabase.co',K='sb_publishable_FpNJG8pi0NPEjz14QKbdpA_TYQw1nso',sb=supabase.createClient(U,K),$=i=>document.getElementById(i);let C=[],V=[],H=[],SV=null;const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0);if(id==='clients')loadClients();if(id==='vehicles')loadVehicles();if(id==='history')loadHistory();if(id==='interv'){loadVehicles(false);$('idate').value=new Date().toISOString().slice(0,10)}}function session(s){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));if(s){$('home').classList.add('on');$('nav').classList.remove('hide');$('out').classList.remove('hide');$('who').textContent=s.user.email;dash()}else{$('auth').classList.add('on');$('nav').classList.add('hide');$('out').classList.add('hide');$('who').textContent='Gestão simples'}}async function auth(kind){let email=$('em').value.trim(),password=$('pw').value;if(!email||password.length<6)return $('amsg').innerHTML='<div class="msg err">Preencha email e palavra-passe.</div>';let r=kind==='up'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});$('amsg').innerHTML=r.error?'<div class="msg err">'+e(r.error.message)+'</div>':kind==='up'&&!r.data.session?'<div class="msg ok">Conta criada. Confirme o email.</div>':''}$('login').onclick=()=>auth('in');$('signup').onclick=()=>auth('up');$('out').onclick=()=>sb.auth.signOut();async function dash(){await Promise.all([loadClients(false),loadVehicles(false)]);$('cc').textContent=C.length;$('vc').textContent=V.length}async function loadClients(r=true){let q=await sb.from('oficina_clientes').select('*').order('nome');if(!q.error)C=q.data||[];fillClients();if(r)renderClients()}function fillClients(){$('vclient').innerHTML='<option value="">Sem cliente associado</option>'+C.map(c=>'<option value="'+c.id+'">'+e(c.nome)+'</option>').join('')}function renderClients(){let q=($('cs').value||'').toLowerCase(),a=C.filter(c=>(c.nome+' '+(c.telefone||'')).toLowerCase().includes(q));$('cl').innerHTML=a.length?a.map(c=>'<div class="row"><div><b>'+e(c.nome)+'</b><small>'+e(c.telefone||'Sem telefone')+' · '+e(c.email||'Sem email')+'</small></div><button class="mini" onclick="editClient(\''+c.id+'\')">Editar</button></div>').join(''):'<p class="muted">Ainda não existem clientes.</p>'}function clientForm(c={}){$('cf').classList.remove('hide');$('cid').value=c.id||'';$('cn').value=c.nome||'';$('cp').value=c.telefone||'';$('ce').value=c.email||'';$('ct').value=c.nif||'';$('cno').value=c.notas||''}function editClient(id){clientForm(C.find(x=>x.id===id)||{})}async function saveClient(){let nome=$('cn').value.trim();if(!nome)return alert('Indique o nome.');let p={nome,telefone:$('cp').value||null,email:$('ce').value||null,nif:$('ct').value||null,notas:$('cno').value||null,atualizado_em:new Date().toISOString()},id=$('cid').value,r=id?await sb.from('oficina_clientes').update(p).eq('id',id):await sb.from('oficina_clientes').insert(p);if(r.error)return alert(r.error.message);$('cf').classList.add('hide');await loadClients();dash()}async function loadVehicles(r=true){let q=await sb.from('oficina_viaturas').select('*, oficina_clientes(nome)').order('matricula');if(!q.error)V=q.data||[];if(r)renderVehicles()}function renderVehicles(){let q=($('vs').value||'').toLowerCase(),a=V.filter(v=>(v.matricula+' '+(v.marca||'')+' '+(v.modelo||'')).toLowerCase().includes(q));$('vl').innerHTML=a.length?a.map(v=>'<div class="row"><div><b>'+e(v.matricula)+'</b><small>'+e([v.marca,v.modelo].filter(Boolean).join(' ')||'Sem marca/modelo')+' · '+e(v.oficina_clientes?.nome||'Sem cliente')+'</small></div><button class="mini" onclick="editVehicle(\''+v.id+'\')">Editar</button></div>').join(''):'<p class="muted">Ainda não existem viaturas.</p>'}async function vehicleForm(v={}){await loadClients(false);$('vf').classList.remove('hide');$('vid').value=v.id||'';$('vp').value=v.matricula||'';$('vclient').value=v.cliente_id||'';$('vb').value=v.marca||'';$('vm').value=v.modelo||'';$('vy').value=v.ano||'';$('vkm').value=v.quilometragem_atual||'';$('vv').value=v.vin||'';$('vn').value=v.notas||''}function editVehicle(id){vehicleForm(V.find(x=>x.id===id)||{})}async function saveVehicle(){let matricula=$('vp').value.trim().toUpperCase();if(!matricula)return alert('Indique a matrícula.');let p={matricula,cliente_id:$('vclient').value||null,marca:$('vb').value||null,modelo:$('vm').value||null,ano:+$('vy').value||null,quilometragem_atual:+$('vkm').value||null,vin:$('vv').value||null,notas:$('vn').value||null,atualizado_em:new Date().toISOString()},id=$('vid').value,r=id?await sb.from('oficina_viaturas').update(p).eq('id',id):await sb.from('oficina_viaturas').insert(p);if(r.error)return alert(r.error.message);$('vf').classList.add('hide');await loadVehicles();dash()}async function findVehicle(){await loadVehicles(false);let p=$('ip').value.trim().toUpperCase();SV=V.find(v=>v.matricula.toUpperCase()===p)||null;if(!SV)return $('match').innerHTML='<div class="msg err">Matrícula não encontrada. Crie primeiro a viatura.</div>';$('match').innerHTML='<div class="msg ok"><b>'+e(SV.matricula)+'</b> — '+e([SV.marca,SV.modelo].filter(Boolean).join(' '))+'</div>';$('ikm').value=SV.quilometragem_atual||''}function addPart(){let d=document.createElement('div');d.className='part';d.innerHTML='<label>Nome da peça</label><input class="pn" placeholder="Ex.: Filtro de óleo"><div class="grid"><div><label>Referência</label><input class="pr"></div><div><label>Quantidade</label><input class="pq" type="number" step="0.01" value="1"></div></div><button class="btn d" onclick="this.parentElement.remove()">Remover peça</button>';$('parts').appendChild(d)}$('odo').onchange=()=>{$('odon').textContent=$('odo').files[0]?'✓ '+$('odo').files[0].name:''};$('photos').onchange=()=>{$('phn').textContent=$('photos').files.length?'✓ '+$('photos').files.length+' fotografia(s) selecionada(s)':''};async function upload(f,i,t){let u=(await sb.auth.getUser()).data.user,ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=u.id+'/'+i+'/'+crypto.randomUUID()+'.'+ext,r=await sb.storage.from('oficina-fotos').upload(path,f,{contentType:f.type||'image/jpeg'});if(r.error)throw r.error;let d=await sb.from('oficina_fotografias').insert({intervencao_id:i,tipo:t,caminho_storage:path});if(d.error)throw d.error}async function saveIntervention(){if(!SV||SV.matricula!==$('ip').value.trim().toUpperCase())await findVehicle();if(!SV)return;let km=+$('ikm').value,tipo=$('itype').value.trim();if(!km||!tipo)return $('imsg').innerHTML='<div class="msg err">Preencha quilómetros e tipo de serviço.</div>';if(!$('odo').files[0])return $('imsg').innerHTML='<div class="msg err">A fotografia do conta-quilómetros é obrigatória.</div>';$('savei').disabled=true;$('savei').textContent='A guardar…';try{let r=await sb.from('oficina_intervencoes').insert({viatura_id:SV.id,data:$('idate').value,quilometragem:km,tipo_servico:tipo,descricao:$('idesc').value||null,notas:$('inotes').value||null}).select().single();if(r.error)throw r.error;for(let n of document.querySelectorAll('.part')){let nome=n.querySelector('.pn').value.trim();if(nome){let x=await sb.from('oficina_pecas').insert({intervencao_id:r.data.id,nome,referencia:n.querySelector('.pr').value||null,quantidade:+n.querySelector('.pq').value||1});if(x.error)throw x.error}}await upload($('odo').files[0],r.data.id,'conta_quilometros');for(let f of $('photos').files)await upload(f,r.data.id,'trabalho');await sb.from('oficina_viaturas').update({quilometragem_atual:km,atualizado_em:new Date().toISOString()}).eq('id',SV.id);$('imsg').innerHTML='<div class="msg ok">✓ Intervenção guardada com sucesso.</div>';SV=null;['ip','ikm','itype','idesc','inotes'].forEach(i=>$(i).value='');$('parts').innerHTML='';$('match').innerHTML='';$('odo').value='';$('photos').value='';$('odon').textContent='';$('phn').textContent='';dash()}catch(x){$('imsg').innerHTML='<div class="msg err">'+e(x.message||x)+'</div>'}finally{$('savei').disabled=false;$('savei').textContent='✓ Terminar e guardar'}}async function loadHistory(){let r=await sb.from('oficina_intervencoes').select('*, oficina_viaturas(matricula,marca,modelo,oficina_clientes(nome)), oficina_pecas(nome)').order('data',{ascending:false}).order('criado_em',{ascending:false});if(!r.error)H=r.data||[];renderHistory()}function renderHistory(){let q=($('hs').value||'').toLowerCase(),a=H.filter(h=>((h.oficina_viaturas?.matricula||'')+' '+h.tipo_servico+' '+(h.descricao||'')).toLowerCase().includes(q));$('hl').innerHTML=a.length?a.map(h=>'<div class="card"><div class="head"><h3>'+e(h.oficina_viaturas?.matricula||'')+'</h3><b>'+Number(h.quilometragem).toLocaleString('pt-PT')+' km</b></div><b>'+e(h.tipo_servico)+'</b><p class="muted">'+e(h.descricao||'Sem descrição')+'</p>'+(h.oficina_pecas?.length?'<p><b>Peças:</b> '+h.oficina_pecas.map(p=>e(p.nome)).join(', ')+'</p>':'')+'<small class="muted">'+e(h.data)+' · '+e(h.oficina_viaturas?.oficina_clientes?.nome||'Sem cliente')+'</small></div>').join(''):'<p class="muted">Ainda não existem intervenções.</p>'}sb.auth.getSession().then(r=>session(r.data.session));sb.auth.onAuthStateChange((_,s)=>session(s));</script></body></html>
